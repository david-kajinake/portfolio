{% extends 'portfolio/base.html' %}
{% load static %}

{% block css_link %}
 <link rel="stylesheet" href="{% static 'portfolio/css/projects.css' %}?v={{ css_version }}">
 <link rel="stylesheet" href="{% static 'portfolio/css/resume.css' %}?v={{ css_version }}">
{% endblock %}

{% block content %}
<section class="resume-page">
    <div class="resume-header">
        <h1 class="section-title">My Resume</h1>
        <div class="resume-actions">
            <a href="{% static 'portfolio/docs/david_kajinake_resume.pdf' %}" download class="btn-card">
                Download PDF
            </a>
            <a href="{% static 'portfolio/docs/david_kajinake_resume.pdf' %}" target="_blank" class="btn-card outline">
                Open in New Tab
            </a>
        </div>
    </div>
    
    <div class="pdf-container">
        <iframe 
            src="{% static 'portfolio/docs/david_kajinake_resume.pdf' %}" 
            title="Resume PDF"
            loading="lazy">
            <p>Your browser does not support PDFs. 
               <a href="{% static 'portfolio/docs/david_kajinake_resume.pdf' %}">Download the PDF</a>.
            </p>
        </iframe>
    </div>
</section>
{% endblock %}
